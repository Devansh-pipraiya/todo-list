<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>"
    />
    <title>ToDo</title>
  </head>
  <body>
    <header>
      <h2 id="heading">what To DO?</h2>
      <button id="add-task-btn">+ Add Task</button>
      <div id="filters-btn-container">
        <div class="pill-glider" aria-hidden="true"></div>
        <button class="completed">Completed</button>
        <button class="today active">Today</button>
        <button class="upcoming">Upcoming</button>
      </div>
    </header>
    <aside>
      <button>All</button>
      <button class="active">Inbox</button>
      <h2>Projects</h2>
      <button>Work</button>
      <button id="add-projects-btn">+</button>
    </aside>
    <main>
      <div id="tasks-container" class="tasks-list"></div>
    </main>
    <footer>
      <div class="footer-content">
        Copyright ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Devansh-Pipraiya
        <a
          href="https://github.com/Devansh-pipraiya"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Profile"
        >
          <svg class="github-logo" width="26" height="26" viewBox="0 0 24 24">
            <path
              d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.6.113.793-.261.793-.577 0-.285-.01-1.044-.015-2.05-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.744.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.467-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.604-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.298 24 12 24 5.373 18.627 0 12 0z"
            />
          </svg>
        </a>
      </div>
    </footer>
    <dialog id="task-modal">
      <form id="task-form" method="dialog">
        <div class="modal-header">
          <h3>Add New Task</h3>
          <button
            type="button"
            id="close-modal-btn"
            class="btn-close-modal"
            aria-label="Close modal"
          >
            ✕
          </button>
        </div>

        <div class="form-group">
          <label for="task-title">Title *</label>
          <input
            type="text"
            id="task-title"
            name="title"
            placeholder="e.g. Finish chemistry assignment"
            required
          />
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea
            id="task-desc"
            name="description"
            rows="2"
            placeholder="Add more details..."
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" name="duedate" />
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-project">Project</label>
            <select id="task-project" name="projectName">
              <option value="inbox" selected>Inbox</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-notes">Notes</label>
          <textarea
            id="task-notes"
            name="notes"
            rows="2"
            placeholder="Additional notes or checklist..."
          ></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn-cancel">Cancel</button>
          <button type="submit" id="submit-task-btn" class="btn-submit">Add Task</button>
        </div>
      </form>
    </dialog>

    <dialog id="project-modal">
      <form id="project-form" method="dialog">
        <div class="modal-header">
          <h3>Add New Project</h3>
          <button
            type="button"
            id="close-project-modal-btn"
            class="btn-close-modal"
            aria-label="Close modal"
          >
            ✕
          </button>
        </div>

        <div class="form-group">
          <label for="project-name-input">Project Name *</label>
          <input
            type="text"
            id="project-name-input"
            name="projectName"
            placeholder="e.g. Study, Fitness, Personal"
            required
          />
          <p id="project-error-msg" class="form-error" style="display: none"></p>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancel-project-modal-btn" class="btn-cancel">Cancel</button>
          <button type="submit" id="submit-project-btn" class="btn-submit">Add Project</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
